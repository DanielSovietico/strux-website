[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "extractor-etabs"
version = "1.0.0"
description = "Aplicación de escritorio para extraer momentos, cortantes y deformaciones de modelos de ETABS"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Strux" }]
keywords = ["etabs", "csi", "oapi", "estructural", "momentos", "cortantes",
            "deflexiones", "ingenieria"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
etabs = ["comtypes>=1.2 ; sys_platform == 'win32'"]
empaquetado = ["pyinstaller>=6.0"]

[project.scripts]
extractor-etabs = "extractor_etabs.cli:main"

[project.gui-scripts]
extractor-etabs-gui = "extractor_etabs.ui.app:main"

[tool.setuptools.packages.find]
include = ["extractor_etabs*"]

[tool.setuptools.package-data]
extractor_etabs = ["py.typed"]
