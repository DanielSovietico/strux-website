        e.target.tagName, String(e.target.src || e.target.href || ''));

    const templateEl = document.querySelector('script[type="__bundler/template"]');

      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's

    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin

    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // deny-by-default: one request form, one reply form, no error

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

        // request spray; past the cap (far above any real page count) new

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

              const { done, value } = await reader.read();

        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

        console.error('Failed to decode asset ' + uuid + ':', err);

    const resourceMap = {};

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      ';</' + 'script>';

    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r('No se cargó etabs_import.js: verifica que esté junto a este archivo.');\n    return window.EtabsImport;\n  }\n\n  // El observer se engancha desde el ref del propio <svg>: React lo invoca al\n  // montar y desmontar el nodo, sin depender de componentDidMount/Update.\n  setSvg = (el) => {\n    if (!el || el === this._obs) { if (el) this._svg = el; return; }\n    if (this._ro) { this._ro.disconnect(); this._ro = null; }\n    this._svg = el; this._obs = el;\n    const sync = () => {\n      const r = el.getBoundingClientRect();\n      if (r.width < 4 || r.height < 4) return;\n      if (Math.abs((this.state.vw || 0) - r.width) > 1 || Math.abs((this.state.vh || 0) - r.height) > 1)\n        this.setState({ vw: r.width, vh: r.height });\n    };\n    if (typeof ResizeObserver !== 'undefined') { this._ro = new ResizeObserver(() => requestAnimationFrame(sync)); this._ro.observe(el); }\n    requestAnimationFrame(sync);\n  };\n\n  componentDidMount() {\n    // El lienzo de planta no existe al montar (la pantalla inicial es «importar»),\n    // así que se espera a que aparezca en el DOM para medirlo.\n    this._mo = new MutationObserver(() => this.setSvg(document.querySelector('[data-plan-svg]')));\n    this._mo.observe(document.documentElement, { childList: true, subtree: true });\n    this.setSvg(document.querySelector('[data-plan-svg]'));\n    if (this.props.autoDemo !== false) this.loadDemo(true);\n  }\n  componentWillUnmount() { if (this._ro) this._ro.disconnect(); if (this._mo) this._mo.disconnect(); }\n\n  // ── importación (único camino: archivo → parser → estado) ────────────────\n  async readE2K(text, name) {\n    const m = await this.mod();\n    const r = m.parseE2K(text, name);\n    if (!r.ok) {\n      // Falla de lectura: se queda en el paso 1 con el error a la vista y\n      // NO se conserva el modelo anterior como si siguiera cargado.\n      this._frKey = null;\n      this.setState({\n        impErr: r.error || 'No se pudo interpretar el archivo.',\n        e2k: null, src: null, story: null, sel: [], bast: null, stir: null,\n        ff: null, ffErr: null, useCase: null, svcCase: null, sustCase: null, rawCase: null,\n        screen: 'conn',\n      });\n      return false;\n    }\n    const first = r.stories.filter(x => (r.beamsByStory[x.n] || []).length)[0] || r.stories[0];\n    const mx = r.gx.length ? r.gx[r.gx.length - 1][1] : 10;\n    const my = r.gy.length ? r.gy[r.gy.length - 1][1] : 10;\n    this._frKey = null;\n    this.setState({\n      e2k: r, impErr: null, src: { file: name, kind: 'e2k' },\n      story: first ? first.n : null, sel: [], bast: null, stir: null,\n      ff: null, ffErr: null, useCase: null, svcCase: null, sustCase: null, rawCase: null,\n      zoom: 1, cx: mx / 2, cy: my / 2,\n    });\n    return true;\n  }\n  async readFF(text, name) {\n    const m = await this.mod();\n    const r = m.parseFrameForces(text, name);\n    if (!r.ok) { this.setState({ ffErr: r.error || 'No se pudo interpretar la tabla.', ff: null }); return; }\n    const pick = (re) => r.cases.filter(c => re.test(c))[0] || null;\n    const svc = pick(/servicio|^CM\\s*\\+\\s*CV$/i) || r.cases[0];\n    const sust = pick(/sosten|0\\.4|0,4/i) || svc;\n    const use = {};\n    r.cases.forEach(c => { use[c] = c !== svc && c !== sust; });\n    if (!Object.keys(use).some(k => use[k])) use[r.cases[0]] = true;\n    this.setState({ ff: r, ffErr: null, useCase: use, svcCase: svc, sustCase: sust, rawCase: r.cases[0] });\n  }\n  // ── OAPI: modelo abierto en ETABS ────────────────────────────────────────\n  async oapiModel() {\n    const m = await this.mod();\n    this.setState({ busy: 'Leyendo el modelo abierto en ETABS…', impErr: null });\n    try {\n      const r = await m.requestModel();\n      if (!r.ok) { this.setState({ busy: null, impErr: r.error || 'ETABS respondió sin geometría utilizable.', e2k: null, src: null, screen: 'conn' }); return; }\n      const first = r.stories.filter(x => (r.beamsByStory[x.n] || []).length)[0] || r.stories[0];\n      const mx = r.gx.length ? r.gx[r.gx.length - 1][1] : 10, my = r.gy.length ? r.gy[r.gy.length - 1][1] : 10;\n      this._frKey = null;\n      this.setState({\n        busy: null, e2k: r, impErr: null, src: { file: r.file, kind: 'oapi' },\n        story: first ? first.n : null, sel: [], bast: null, stir: null,\n        ff: null, ffErr: null, useCase: null, svcCase: null, sustCase: null, rawCase: null,\n        zoom: 1, cx: mx / 2, cy: my / 2, screen: 'plan',\n      }, () => this.autoSel());\n    } catch (e) { this.setState({ busy: null, impErr: e.message }); }\n  }\n  async oapiForces() {\n    const m = await this.mod(), c = this.chain();\n    if (!c) return;\n    this.setState({ busy: 'Pidiendo Results.FrameForce de ' + c.F.length + ' frames…', ffErr: null });\n    try {\n      const r = await m.requestFrameForces(this.state.story, c.F.map(f => f.id), this.E() ? this.E().cases : []);\n      if (!r.ok) { this.setState({ busy: null, ffErr: r.error, ff: null }); return; }\n      const pick = (re) => r.cases.filter(x => re.test(x))[0] || null;\n      const svc = pick(/servicio|^CM\\s*\\+\\s*CV$/i) || r.cases[0];\n      const sust = pick(/sosten|0\\.4|0,4/i) || svc;\n      const use = {};\n      r.cases.forEach(x => { use[x] = x !== svc && x !== sust; });\n      if (!Object.keys(use).some(k => use[k])) use[r.cases[0]] = true;\n      this.setState({ busy: null, ff: r, ffErr: null, useCase: use, svcCase: svc, sustCase: sust, rawCase: r.cases[0] });\n    } catch (e) { this.setState({ busy: null, ffErr: e.message }); }\n  }\n\n  // En el archivo autocontenido los ejemplos llegan como blobs en\n  // window.__resources; en el proyecto son rutas normales.\n  res(id, path) { return (window.__resources && window.__resources[id]) || path; }\n\n  loadDemo(silent) {\n    fetch(this.res('sampleE2K', 'samples/Ejemplo.e2k')).then(r => { if (!r.ok) throw new Error('no'); return r.text(); })\n      .then(t => this.readE2K(t, 'Ejemplo.e2k'))\n      .then(ok => { if (ok) this.setState({ screen: 'plan' }, () => this.autoSel()); })\n      .catch(() => this.setState({ impErr: 'No se encontró samples/Ejemplo.e2k en el proyecto.', screen: 'conn' }));\n  }\n  loadDemoFF() {\n    fetch(this.res('sampleFF', 'samples/Ejemplo_FrameForces.csv')).then(r => { if (!r.ok) throw new Error('no'); return r.text(); })\n      .then(t => this.readFF(t, 'Ejemplo_FrameForces.csv'))\n      .catch(() => this.setState({ ffErr: 'No se encontró samples/Ejemplo_FrameForces.csv en el proyecto.' }));\n  }\n  autoSel() {\n    const F = this.frames(); if (!F.length) return;\n    const lines = {};\n    F.filter(f => f.dir === 'X').forEach(f => { (lines[f.line] = lines[f.line] || []).push(f); });\n    const keys = Object.keys(lines);\n    if (!keys.length) return;\n    const k = keys[Math.min(keys.length - 1, Math.floor(keys.length / 2))];\n    this.setState({ sel: lines[k].map(f => f.id), bast: null, stir: null });\n  }\n\n  // ── datos del modelo (todo del parser) ───────────────────────────────────\n  E() { return this.state.e2k; }\n  stories() { const e = this.E(); return e ? e.stories : []; }\n  st() {\n    const e = this.E(), l = this.stories();\n    const cur = l.filter(x => x.n === this.state.story)[0];\n    if (cur) return cur;\n    const withBeams = l.filter(x => e && (e.beamsByStory[x.n] || []).length);\n    return withBeams[0] || l[0] || null;\n  }\n  gx() { const e = this.E(); return e ? e.gx : []; }\n  gy() { const e = this.E(); return e ? e.gy : []; }\n  ext() {\n    const gx = this.gx(), gy = this.gy();\n    const mx = gx.length ? gx[gx.length - 1][1] : 10, my = gy.length ? gy[gy.length - 1][1] : 10;\n    return { mx, my, w: mx + 9, h: my + 9, cx: mx / 2, cy: my / 2 };\n  }\n  frames() {\n    const e = this.E(), s = this.state.story;\n    if (!e || !s) return [];\n    const key = (this.state.src ? this.state.src.file : '') + '|' + s;\n    if (this._frKey === key) return this._fr;\n    const l = (e.beamsByStory[s] || []).slice().sort((p, q) => (p.dir === q.dir) ? (p.dir === 'X' ? p.x1 - q.x1 : p.y1 - q.y1) : (p.dir < q.dir ? -1 : 1));\n    this._frKey = key; this._fr = l; return l;\n  }\n  secDim(name) {\n    const e = this.E(), s = e && e.sections[name];\n    if (s && s.b != null && s.h != null) return [s.b, s.h];\n    const p = String(name || '').replace(/[^0-9Xx]/g, '').toUpperCase().split('X');\n    const b = parseFloat(p[0]), h = parseFloat(p[1]);\n    return [isFinite(b) ? b : 30, isFinite(h) ? h : 70];\n  }\n  frameL(f) { return Math.round((f.dir === 'X' ? f.x2 - f.x1 : f.y2 - f.y1) * 1000) / 1000; }\n\n  chain() {\n    const sel = this.state.sel, F = this.frames().filter(f => sel.indexOf(f.id) >= 0);\n    if (!F.length) return null;\n    const dirs = {}, lines = {}, secs = {};\n    F.forEach(f => { dirs[f.dir] = 1; lines[f.line] = 1; secs[f.sec] = 1; });\n    const srt = F.slice().sort((p, q) => p.dir === 'X' ? p.x1 - q.x1 : p.y1 - q.y1);\n    const spans = srt.map(f => this.frameL(f));\n    let cont = true;\n    for (let i = 1; i < srt.length; i++) if (srt[i].a !== srt[i - 1].b) cont = false;\n    return {\n      F: srt, spans, joints: [srt[0].a].concat(srt.map(f => f.b)),\n      align: Object.keys(dirs).length === 1 && Object.keys(lines).length === 1,\n      cont, secs: Object.keys(secs), sec: srt[0].sec, dir: srt[0].dir, line: srt[0].line,\n      L: Math.round(spans.reduce((a, b) => a + b, 0) * 1000) / 1000,\n    };\n  }\n  valid() { const c = this.chain(); return !!(c && c.align && c.cont && c.secs.length === 1); }\n\n  // ── estaciones importadas ────────────────────────────────────────────────\n  cases() { const f = this.state.ff; return f ? f.cases : []; }\n  activeCases() {\n    const u = this.state.useCase || {}, l = this.cases().filter(c => u[c]);\n    return l.length ? l : this.cases().slice(0, 1);\n  }\n  sta(frameId, caseName) {\n    const f = this.state.ff; if (!f) return null;\n    const b = f.byKey[this.state.story + '|' + frameId];\n    const r = b && b[caseName];\n    if (!r || r.length < 2) return null;\n    const sg = this.state.flip ? -1 : 1;\n    return r.map(p => ({ x: p.x, M: p.M * sg, V: p.V * sg, P: p.P }));\n  }\n  chainSta(caseName) {\n    const c = this.chain(); if (!c) return null;\n    const out = [];\n    for (let i = 0; i < c.F.length; i++) { const r = this.sta(c.F[i].id, caseName); if (!r) return null; out.push(r); }\n    return out;\n  }\n  missingFor() {\n    const c = this.chain(); if (!c) return [];\n    const miss = [];\n    this.activeCases().forEach(cs => c.F.forEach(f => { if (!this.sta(f.id, cs)) miss.push(f.id + ' / ' + cs); }));\n    return miss;\n  }\n  wFrom(rows) {   // carga uniforme deducida de la pendiente de V2 importada\n    if (!rows || rows.length < 2) return null;\n    const L = rows[rows.length - 1].x - rows[0].x;\n    if (L <= 0) return null;\n    return (rows[0].V - rows[rows.length - 1].V) / L;\n  }\n  interp(rows, x) {\n    if (!rows || !rows.length) return null;\n    if (x <= rows[0].x) return rows[0];\n    for (let i = 1; i < rows.length; i++) if (x <= rows[i].x) {\n      const a = rows[i - 1], b = rows[i], t = (x - a.x) / (b.x - a.x || 1);\n      return { x, M: a.M + (b.M - a.M) * t, V: a.V + (b.V - a.V) * t, P: 0 };\n    }\n    return rows[rows.length - 1];\n  }\n\n  env() {\n    const c = this.chain(); if (!c) return null;\n    const cases = this.activeCases();\n    const per = [];\n    for (let k = 0; k < cases.length; k++) { const s = this.chainSta(cases[k]); if (s) per.push({ id: cases[k], sta: s }); }\n    if (!per.length) return null;\n    const sp = c.spans.map((L, i) => {\n      const xs = per[0].sta[i].map(p => p.x);\n      const pts = xs.map(x => {\n        let mx = -1e9, mn = 1e9, vx = 0, gm = '', gv = '';\n        per.forEach(p => {\n          const r = this.interp(p.sta[i], x);\n          if (r.M > mx) mx = r.M;\n          if (r.M < mn) { mn = r.M; gm = p.id; }\n          if (Math.abs(r.V) > Math.abs(vx)) { vx = r.V; gv = p.id; }\n        });\n        return { x, t: L > 0 ? x / L : 0, Mmax: mx, Mmin: mn, V: vx, gm, gv };\n      });\n      return { L, pts, i };\n    });\n    const jn = c.joints.map((lab, p) => {\n      let mn = 1e9, mx = -1e9, gov = '';\n      per.forEach(pp => {\n        const v = [];\n        if (p > 0) { const r = pp.sta[p - 1]; v.push(r[r.length - 1].M); }\n        if (p < c.spans.length) v.push(pp.sta[p][0].M);\n        v.forEach(q => { if (q < mn) { mn = q; gov = pp.id; } if (q > mx) mx = q; });\n      });\n      return { lab, Mneg: mn, Mpos: mx, gov };\n    });\n    return { sp, jn, per, cases: per.map(p => p.id) };\n  }\n\n  // ── armado ──────────────────────────────────────────────────────────────\n  ab(b) { return ({ 3: 0.71, 4: 1.27, 5: 1.98, 6: 2.85, 8: 5.07, 10: 7.92, 12: 11.40 })[b] || 0; }\n  db(b) { return ({ 3: 0.95, 4: 1.27, 5: 1.59, 6: 1.91, 8: 2.54, 10: 3.18, 12: 3.81 })[b] || 0; }\n  wb(b) { return ({ 3: 0.557, 4: 0.994, 5: 1.552, 6: 2.235, 8: 3.973, 10: 6.225, 12: 8.938 })[b] || 0; }\n  keys() {\n    const c = this.chain(); if (!c) return [];\n    const out = []; let x = 0;\n    c.joints.forEach((j, p) => {\n      out.push({ k: j, type: 'sup', x, label: 'Apoyo ' + j, p });\n      if (p < c.spans.length) { out.push({ k: 'L' + (p + 1), type: 'span', x: x + c.spans[p] / 2, label: 'Claro ' + (p + 1), p }); x += c.spans[p]; }\n    });\n    return out;\n  }\n  pickBars(extra) {   // menor combinación n·Ab que cubra el acero faltante\n    if (extra <= 0.01) return { n: 2, bar: 6 };\n    const bars = [6, 8, 10, 12];\n    for (let bi = 0; bi < bars.length; bi++)\n      for (let n = 2; n <= 6; n++)\n        if (n * this.ab(bars[bi]) >= extra) return { n, bar: bars[bi] };\n    return { n: 6, bar: 12 };\n  }\n  defBast() {\n    const c = this.chain(); if (!c) return [];\n    const E = this.env();\n    const asT = this.state.corrT.n * this.ab(this.state.corrT.bar);\n    const asB = this.state.corrB.n * this.ab(this.state.corrB.bar);\n    const o = [];\n    c.joints.forEach((j, p) => {\n      const lA = p > 0 ? c.spans[p - 1] : 0, rA = p <
